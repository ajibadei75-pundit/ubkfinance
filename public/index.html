html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.01em}small{color:var(--mut)}.ic{width:18px;height:18px;flex:none}.r{text-align:right}
.app{display:flex;min-height:100vh}.col{flex:1;min-width:0}
aside{width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.lg{display:flex;align-items:center;gap:10px;margin:0 0 18px 4px}.lg img{width:38px;height:38px;border-radius:50%}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mut);cursor:pointer;font:inherit;font-weight:500;border:0;background:none;text-align:left;transition:.15s}.nv:hover{background:var(--bg);color:var(--ink)}.nv.on{background:var(--btn);color:#fff}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.top h1{font-size:20px;margin:0}.tr{display:flex;align-items:center;gap:10px}
.clock{text-align:right;line-height:1.25}.clock b{font-size:16px;font-variant-numeric:tabular-nums}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}.ib:hover{border-color:var(--pri)}
main{padding:24px;max-width:1240px;margin:0 auto;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh);overflow-x:auto;margin-bottom:16px}.card h3{margin:0 0 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-bottom:16px}.cg .card{margin:0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin-bottom:16px}
.k{--c:var(--pri);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;transition:.2s}.k:hover{transform:translateY(-3px)}
.t-o{--c:var(--acc)}.t-g{--c:var(--ok)}.t-r{--c:var(--bad)}.kc{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.k b{font-size:20px;display:block;font-variant-numeric:tabular-nums;line-height:1.2}.dl{font-size:12px;font-weight:600;color:var(--mut)}.up{color:var(--ok)}.dn{color:var(--bad)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer}.seg .on{background:var(--btn);color:#fff}
.in{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.in:first-of-type{border:0}.in:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--d,var(--acc));margin-top:7px;flex:none}
table{width:100%;border-collapse:collapse;min-width:520px}th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:8px}td{padding:10px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}tr:nth-child(even) td{background:color-mix(in srgb,var(--line) 25%,transparent)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:9px;transition:width 1s}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%}input:focus,select:focus,.b:focus-visible,.nv:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}.tb{display:flex;gap:8px;margin-bottom:12px}
.b{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.b:hover{filter:brightness(1.12);transform:translateY(-1px)}.b.o{background:var(--acc);color:#1c1840}.b.s{padding:5px 10px;font-size:13px}.b.ok{background:var(--ok)}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}.chip.ok{background:#12996a26;color:var(--ok)}.chip.bad{background:#d6454526;color:var(--bad)}.chip.pt{background:#f08a2430;color:var(--acc)}
.lgd{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);justify-content:center;margin-top:6px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
#lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#2d1f7b,#5b4bd0 60%,#f08a24)}
.lb{background:var(--card);border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px #0005;animation:in .5s}.lb img{width:104px;border-radius:50%}.lb h1{font-size:22px;margin:12px 0 2px}.lf{display:grid;gap:10px;margin-top:18px}.dm{display:block;margin-top:16px;line-height:1.6}
#m{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;overflow:auto;z-index:20}#m.on{display:grid}.mb{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:440px;animation:in .25s;max-height:94vh;overflow:auto}
.rc{border:2px dashed var(--line);border-radius:12px;padding:14px;position:relative;text-align:center}.rc img.w{position:absolute;inset:25% 20%;width:60%;opacity:.07}.rc .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);text-align:left;position:relative}
#t{position:fixed;bottom:90px;left:50%;transform:translate(-50%,120px);background:var(--btn);color:#fff;padding:12px 20px;border-radius:12px;transition:.4s;z-index:30;max-width:92vw}#t.on{transform:translate(-50%,0)}#t.e{background:var(--bad)}
@media(max-width:1000px){aside{width:64px;padding:14px 8px}aside .nv span,aside .lg b{display:none}.nv{justify-content:center}.lg{margin-left:0;justify-content:center}}
@media(max-width:700px){aside{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:8;border-right:0;border-top:1px solid var(--line)}aside .lg{display:none}.nv{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 6px}aside .nv span{display:block}main{padding:14px 14px 96px}.top{padding:10px 14px}.clock small{display:none}input,select{font-size:16px}}

.ch rect{transform-box:fill-box;transform-origin:bottom;animation:gw .8s cubic-bezier(.2,.8,.2,1) both}@keyframes gw{from{transform:scaleY(0)}}
.ch polyline{stroke-dasharray:1400;animation:dr 1.4s ease-out forwards}@keyframes dr{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.dn2{animation:sp .9s ease-out}@keyframes sp{from{opacity:0;transform:rotate(-90deg) scale(.85)}}
tr:hover td{background:color-mix(in srgb,var(--pri) 8%,transparent)}
.sy{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--mut);white-space:nowrap}.sy:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut)}.sy.on:before{background:var(--ok);animation:pl 2s infinite}.sy.off:before{background:var(--bad)}@keyframes pl{50%{opacity:.3}}
.qa{display:flex;gap:8px;flex-wrap:wrap}.b:disabled{opacity:.6;cursor:wait}
@media(max-width:700px){.sy{font-size:0;gap:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

async function addUs(){const u={n:$('#un').value.trim(),e:$('#ue').value.trim().toLowerCase(),p:$('#up').value,r:$('#ur').value};if(!u.n||!u.e||u.p.length<8)return toast('Need name, email and a password of 8+ characters',1);const r=await api('POST','/api/users',u);if(!r.ok)return toast((await r.json()).error||'Failed',1);USERS=await(await api('GET','/api/users')).json();render();toast('Access granted')}

function payM(id){const s=S.st.find(x=>x.id==id);op(`<h3>Payment – ${esc(s.n)}</h3><small>${esc(s.c)} · Balance ${N(s.f-tot(s))}</small><input id="pa" type="number" placeholder="Amount (₦)" style="margin:10px 0"><select id="pm"><option>Cash</option><option>Transfer</option><option>POS</option></select><div style="display:flex;gap:8px;margin-top:12px"><button class="b" onclick="doPay('${id}')">Save &amp; issue receipt</button><button class="b o" onclick="cl()">Cancel</button></div>`)}

async function dl(d,name){const b=d.output('blob');try{const x=window.claude&&await claude.use('downloads');if(x){await x.save({filename:name,data:b});return}}catch(e){if(e&&e.code=='declined')return}d.save(name)}

function tbl(d,y,cols,rows,ws,al){const W=210;const row=(r,h)=>{if(y>270){d.addPage();wm(d);y=20}if(h){d.setFillColor(45,31,123);d.rect(14,y-5,182,8,'F');d.setTextColor(255)}else d.setTextColor(30);let x=14;r.forEach((c,i)=>{d.text(String(c).slice(0,34),al[i]=='r'?x+ws[i]-2:x+2,y,{align:al[i]=='r'?'right':'left'});x+=ws[i]});if(!h){d.setDrawColor(228);d.line(14,y+2.5,196,y+2.5)}y+=8};d.setFontSize(9);d.setFont('helvetica','bold');row(cols,1);d.setFont('helvetica','normal');rows.forEach(x=>row(x));return y+4}

const expPay=()=>csv('receipts-'+iso()+'.csv',[['Receipt','Date','Time','ID','Pupil','Class','Method','Amount','Balance','Confirmed'],...allPays().map(p=>[p.r,p.d,p.t,p.s.id,p.s.n,p.s.c,p.m,p.a,p.b,p.c?'Yes':'No'])]);
function clsFee(){const c=$('#bc').value,f=+$('#bf').value;if(!c||f<=0)return toast('Pick a class and enter a fee',1);S.cl[c]=f;S.st.filter(s=>s.c==c).forEach(s=>s.f=f);save();render();toast('Fee set for every pupil in '+c)}
function stFee(id){const s=St(id);op(`<h3>Set fee – ${esc(s.n)}</h3><small>${s.id} · paid so far ${N(tot(s))}</small><input id="nf" type="number" value="${s.f}" style="margin:10px 0"><div style="display:flex;gap:8px"><button class="b" onclick="doFee('${id}')">Save</button><button class="b o" onclick="cl()">Cancel</button></div>`)}
function doFee(id){const f=+$('#nf').value;if(!(f>=0))return toast('Invalid fee',1);St(id).f=f;save();cl();render();toast('Fee updated')}
function conf(id,r){const p=St(id).pay.find(x=>x.r==r);p.c=1;p.cb=me.n;save();render();rcM(id,r);toast('Payment confirmed')}
function vr(){const q=$('#vr').value.trim().toUpperCase(),p=allPays().find(x=>x.r==q);if(!p)return toast('No receipt found: '+q,1);rcM(p.s.id,p.r)}

async function sv(nm,b){try{const x=window.claude&&await claude.use('downloads');if(x){await x.save({filename:nm,data:b});return}}catch(e){if(e&&e.code=='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nm;a.click()}
const bk=()=>sv('school-finance-backup-'+iso()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}));
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.st)||!Array.isArray(o.ex)||!o.cl)throw 0;S={cl:o.cl,st:o.st,ex:o.ex,seq:o.seq||0};save();render();toast('Backup restored')}catch(e){toast('Invalid backup file',1)}};r.readAsText(f)}
function rst(){op(`<h3>Reset all data?</h3><p><small>This removes every student, payment and expense for every user. Export a backup first.</small></p><div style="display:flex;gap:8px"><button class="b" style="background:var(--bad)" onclick="doRst()">Yes, reset</button><button class="b o" onclick="cl()">Cancel</button></div>`)}
function doRst(){S={cl:{'Nursery 1':25000,'Nursery 2':25000,'Primary 1':35000,'Primary 2':35000,'Primary 3':40000},st:[],ex:[],seq:0};save();cl();render()}
async function chPw(){const r=await api('POST','/api/password',{o:$('#po').value,n:$('#pn').value});if(!r.ok)return toast('Check current password; new one needs 8+ characters',1);$('#po').value=$('#pn').value='';toast('Password updated')}
let SYok=0,SYt='';const setSync=ok=>{SYok=ok;SYt=tm();const e=$('#sy');if(e){e.className='sy '+(ok?'on':'off');e.textContent=ok?'Live · '+SYt:'Offline'}};
const ago=w=>{const s=(Date.now()-new Date(w))/1000;return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':fd(w.slice(0,10))};
const cfm=(m,fn,id)=>op(`<h3>${m}</h3><div style="display:flex;gap:8px;margin-top:12px"><button class="b" style="background:var(--bad)" onclick="${fn}('${id}');cl()">Confirm</button><button class="b o" onclick="cl()">Cancel</button></div>`);
const delEx=id=>{S.ex=S.ex.filter(e=>e.id!=id);save();render();toast('Expense deleted')},delSt=id=>{S.st=S.st.filter(s=>s.id!=id);save();render();toast('Pupil removed')};
function qpay(){const l=S.st.filter(s=>tot(s)<s.f);if(!l.length)return toast('No pupils with outstanding fees',1);op(`<h3>Record payment</h3><select id="qs" style="margin:10px 0" aria-label="Pupil">${l.map(s=>`<option value="${s.id}">${esc(s.n)} · ${s.id} · owes ${N(s.f-tot(s))}</option>`).join('')}</select><button class="b" onclick="payM($('#qs').value)">Continue</button>`)}
document.addEventListener('keydown',e=>{if(e.key=='Escape')cl()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&!busy)pull().then(render).catch(()=>setSync(0))});
try{const o=JSON.parse(sessionStorage.getItem('ubk'));if(o){TOK=o.t;me=o.u}}catch(e){}
if(me)pull().then(render).catch(()=>{me=null;render()});else render();
</script></body></html>
